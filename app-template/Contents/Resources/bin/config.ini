# 自动检测下载URL。可选值[0|1|2]，
# 0=默认 ，只下载支持的图书馆
# 1=通用批量下载（类似IDM、迅雷）
# 2=IIIF 标准类型网站自动检测
app_mode = 0

[paths]
# 下载文件存放目录，空值是当前目录
data = ""

[download]
# 输出文件扩展名[.jpg|.tif|.png|.pdf]等
ext = ".jpg"

# 最大并发连接数。
# 建议 2-6；设置过高可能引起卡顿、发热或目标站点限流。
# 0=自动识别CPU核数*2
threads = 2

# 下载限速 N 秒/任务，0=不限速；网络不稳时建议 5-30
# GUI wrapper 也支持 -interval（抓取间隔）并会映射到此参数。
speed = 0

[custom]
# 页面范围：如 4:434，表示只下载第4到434页
seq = ""

# 多册图书范围：只下第N册，或 3:6 即第3至6册
vol = ""

# 合并PDF文件下载，可选值[0|1]。0=否，1=是。仅对 rbk-doc.npm.edu.tw 有效。
mp = 1

# User-Agent（被目标站点拦截时可更换常见浏览器UA）
ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36 Edg/123.0.0.0"

# 只下载书签目录，可选值[0|1]。0=否，1=是。仅对 gj.tianyige.com.cn 有效。
mark = 0

[dzi]
# 使用dezoomify-rs下载，仅对支持iiif的网站生效。
# 0 = 禁用，1=启用
dzi = 1

# wrapper 日志/兼容策略的 dzi 选择：
# auto = 自动（优先 -dzi=false 显示进度条，失败再回退 -dzi=true）
# true = 固定使用 -dzi=true
# false = 固定使用 -dzi=false
mode = "auto"

# 影响JPEG和PNG编码，可节省磁盘空间。不会提升下载速度。
# 默认值 --compression=20 表示JPG品质80
# 最高清图 --compression=0 表示JPG品质100
rs = "-l --compression=20 --timeout=300s --retries=5 --parallelism=2"

# IIIF 图像请求 URI: {size}/{rotation}/{quality}.{format}
# 绝大多数站点保持默认即可
format = "full/full/0/default.jpg"
